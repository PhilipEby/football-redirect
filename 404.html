<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting to football.philipeby.com</title>
<link rel="canonical" href="https://football.philipeby.com/">
<meta http-equiv="refresh" content="0; url=https://football.philipeby.com/">
<script>
  // Forward the exact path, query and fragment, so a deep bookmark such as
  // /sharing.html lands on the same page rather than the front door.
  // replace() rather than assign() keeps this page out of session history,
  // so Back goes where the visitor actually came from.
  location.replace("https://football.philipeby.com"
    + location.pathname + location.search + location.hash);
</script>
</head>
<body>
<p>This site has moved to
<a href="https://football.philipeby.com/">football.philipeby.com</a>.</p>
</body>
</html>
